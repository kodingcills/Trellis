[workspace]
resolver = "2"
members = ["crates/trellis-core", "crates/trellis-source", "crates/trellis-oracle", "crates/trellis-program", "crates/trellis-cas", "crates/trellis-store", "crates/trellis-engine", "crates/trellis-scip"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tofuinparis/Trellis"
rust-version = "1.85"

[workspace.dependencies]
scip = "0.10.0"

[profile.release]
lto = "thin"
codegen-units = 1
