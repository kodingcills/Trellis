[workspace]
resolver = "2"
members = ["crates/trellis-core", "crates/trellis-source", "crates/trellis-oracle"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tofuinparis/Trellis"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
