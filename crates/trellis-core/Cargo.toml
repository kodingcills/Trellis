[package]
name = "trellis-core"
description = "Trellis domain model and invariants: artifacts, derivations, projections, snapshots, validation attestations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# trellis-core depends on almost nothing (spec §73). blake3 (§19) is the
# sanctioned exception: pure computation, recorded in DECISIONS.
[dependencies]
blake3 = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
