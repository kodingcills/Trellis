# .agent/QUALITY_GATES.yaml — what "green" means and how findings are dispositioned.

schema: 1

# GLOBAL_GREEN applies to every node and every commit. Node-specific gates
# are additive and referenced from .agent/ROADMAP.yaml (node → gates:).

GLOBAL_GREEN:
  - command: cargo test --workspace
    requirement: zero failures
  - command: cargo clippy --workspace --all-targets -- -D warnings
    requirement: zero warnings
  - command: cargo fmt --all --check
    requirement: zero diffs
  - requirement: all active-node acceptance tests pass (ROADMAP node → gates)
  - requirement: no architecture-invariant test failures (frozen spec §2 invariants encoded as tests)

# Encoded architecture invariants — a failing one is a BLOCKER by definition.
# Add tests here as they are implemented; a test listed here may not be
# deleted or weakened without a human-escalated DECISIONS entry.
INVARIANT_TESTS:
  - artifact envelope has no mutable epistemic fields (spec §10)
  - attestation history is append-only; individual attestations never transition (spec §12)
  - capture trust is computed from derivation channels, never claimed (spec §13)
  - reuse-policy floor: Valid ∧ Authoritative ∧ ¬Unobserved (spec §15)
  - no continuous dirty tracking / daemon / watcher in v0.1 code paths (spec §5)
  - projection kind/property consistency by construction (spec §7)
  - canonical IDs are algorithm-tagged and reproducible (spec §19)

# Node-specific gates (ROADMAP node → gates). A node's gate MUST be defined
# here before the node can be recorded completed. Define the gate when the
# node is activated, not after the implementation exists.
NODE_GATES:
  M12_OSS_ACCEPTANCE:
    criteria:
      - pinned fixture is real OSS Python code at a recorded lock (project, version, content digest in PIN.json + DECISIONS); the fixture is NEVER treated as a validity oracle
      - index + reconcile + candidate discovery run on the pinned repo within a recorded resource envelope (counts + timings committed)
      - indexing coverage report committed (files indexed, parse failures explicit, definitions extracted); gaps fed back as evidence, not blockers
      - absence-claim behavior on partially-covered files matches M7 semantics: uncovered module → UNKNOWN, never authoritative absence
      - upstream drift handled by pinning only (content digest lock); no rebasing expectations
      - no benchmark-specific shortcuts in production code; M0-M11 tests unchanged and green
    evidence_required: run log with coverage report + fresh review record
  M11_AGENT_BENCHMARK_ACCEPTANCE:
    criteria:
      - independent variable is capture/validity/reuse ONLY: every rung executes the IDENTICAL semantic-query implementation (callers(foo) runs the same underlying caller query in all conditions); no rung receives better program intelligence (§25 fairness contract)
      - minimal ReAct tool-loop agent (~500 lines Python) drives the CLI; the agent remains the actor, Trellis remains the runtime beneath it
      - ladder rungs implemented and run: fresh, exact cache, file-level invalidation, trellis-deterministic (memory/RAG and semantic rungs optional beyond the first three, recorded if skipped)
      - frozen controls identical across conditions: model configuration, prompt/tool descriptions, task, repository start state, context budget, timeout, max steps
      - ≥3 paired trials per task pair; execution order randomized/blocked; task success is the primary gate (correctness unchanged across rungs)
      - metrics measured: task success, wall-clock, model calls, input/output tokens (provider-cached tokens separate), logical tool/repository operations, reuse count, recomputation count, validation overhead, stale reuse (must be 0)
      - fairness checklist documented per run; results + configuration committed
      - no benchmark-specific shortcuts in production code (BLOCKER-level contamination if found); M0-M10 tests unchanged and green
    evidence_required: run log with results + fairness checklist + fresh review record
  M10_BENCHMARK_ACCEPTANCE:
    criteria:
      - Benchmark A runs the FULL M2 mutation catalog (R0-R4, X1-X5) as independent ground truth: per-mutation, per-artifact validity measured against oracle labels; zero false-valid observed on deterministic classes (STRUCTURAL_SET/FACT with complete coverage); stale recall and invalidation precision reported; X5 abstention (UNKNOWN) behavior measured
      - oracle labels never modified; labels never read by evaluation code (only by the harness's assertion layer); results reproducible across two runs within stated variance
      - Benchmark B measures: source reconciliation, candidate discovery, projection reevaluation (validation), SCIP freeze, CAS put/get, attestation append; p50/p95/p99 per operation; scaling across affected-frontier sizes (small/medium/large changed sets)
      - economic premise measured: C_validate (candidate discovery + reevaluation + attestation append) materially below C_recompute (full fixture reindex + reevaluation); numbers committed; kill-criterion analysis recorded honestly
      - reproducible run scripts committed under benchmarks/; results committed with run environment note; reruns reproduce within stated variance
      - M0-M9 tests unchanged and green; no production code changed by the benchmark harness (test-support only)
    evidence_required: run log with measured numbers + fresh review record
  M9_OVERLAY_ACCEPTANCE:
    criteria:
      - overlay view = last frozen SCIP graph + reconcile delta + tree-sitter: mid-task queries reflect the CURRENT tree (a caller added after the freeze is visible in the overlay answer, a caller removed disappears) while the frozen snapshot stays unchanged
      - backend-identity stamping: overlay results record which layer proved them (frozen-graph vs syntactic-overlay) and carry Authority::Provisional, never Authoritative
      - overlay-derived semantic values drive the standard M6 transition but appended attestations are PROVISIONAL + Validity can never satisfy the reuse floor alone (§15: Valid ∧ Authoritative ∧ ¬Unobserved)
      - authority upgrade by append only: a subsequent freeze/revalidation appends an AUTHORITATIVE attestation for the same artifact; every prior attestation byte-identical (history append-only, §12.2)
      - overlay results can never establish completeness-sensitive authority: certificates derived from the overlay carry Unproven reference/inheritance capabilities (Completeness::Unknown for semantic kinds)
      - M0-M8 tests unchanged and green; oracle labels untouched; determinism (overlay evaluation of the same tree+delta is identical)
    evidence_required: run log with test names + fresh review record
  M8_FREEZE_ACCEPTANCE:
    criteria:
      - scip crate ingested ONLY in the trellis-scip adapter crate; zero SCIP types/knowledge in trellis-core/trellis-engine/trellis-program/trellis-store (grep-verified)
      - batch ingest: a SCIP Index over the fixture normalizes into Trellis's own program graph (references/callers/implementations from occurrences + relationships); nothing ingested from unparseable/foreign documents without explicit accounting
      - freeze produces a persisted SemanticSnapshotId; authoritative semantic queries (callers/implementations exact on the fixture) answered from the frozen snapshot and their CoverageCertificate claims resolved_reference + inheritance capabilities Established (capabilities SCIP can prove; §8.2 honesty floor)
      - §6 freeze rule implemented via the change classifier: README-only (or .md/.txt/.cfg non-Python) change with an existing compatible SCIP snapshot → NO freeze required (semantic snapshot reused); auth/*.py change → freeze required for authoritative semantic decisions
      - fixture freeze callers query exact vs oracle labels (R2/X1 members); fixture index produces the same canonical caller sets the oracle labels
      - indexer identity/version/config recorded in coverage evidence (§8.1)
      - M0-M7 tests unchanged and green; oracle labels untouched
      - determinism: same index bytes → same SemanticSnapshotId, same normalized graph, same certificate
    evidence_required: run log with test names + fresh review record
  M7_ABSENCE_ACCEPTANCE:
    criteria:
      - every completeness-sensitive observation binds (Q, U, C): universe digest + coverage digest + indexer identity persisted with the observation (§8.1); non-completeness-sensitive kinds bind none
      - indexer-version change (same tree, empty changed set) dirties all completeness-sensitive observations for reevaluation
      - universe growth (new eligible file) dirties completeness-sensitive observations and reevaluation under complete coverage re-establishes absence claims as VALID (never immediate downstream destruction)
      - coverage degradation (known-failed unit → certificate failure) downgrades absence-bearing artifacts to UNKNOWN, never authoritative absence (§8.2); definition-local dependencies (Signature/FileContent) are unaffected
      - empty result + satisfied requirements → potentially authoritative absence; empty result + unsatisfied requirements → UNKNOWN, never authoritative absence
      - X5 oracle row now matched end-to-end (ART_NO_CALLERS_FACT, ART_CALLERS_REFRESH, ART_PROVIDER_SET, ART_LOGIN_CALLERS → UNKNOWN; ART_VALIDATE_SIG, ART_STATELESS unchanged VALID)
      - projection kinds contain no backend-specific knowledge; SCIP knowledge nowhere (types in trellis-core std-only; certificate produced by the program-index backend; engine only evaluates requirements ⊆ capabilities)
      - M6 transition semantics preserved: value-equality cutoff, append-only attestations, R0-R4/X1-X4 sweep still green
      - oracle labels untouched; M0-M6 tests unchanged and green; determinism verified
    evidence_required: run log with test names + fresh review record
  M6_ORACLE_ACCEPTANCE:
    criteria:
      - §33 first acceptance trace end-to-end: R2 (absence → new caller) — callers projection reevaluates ∅ → {api.webhooks.handle_refresh}; ART_CALLERS_REFRESH and ART_NO_CALLERS_FACT append STALE; all other seeded artifacts keep standing with no new attestations
      - §33 red/green counterexample end-to-end: R3 chained on R2 (caller implementation body changes, caller relation identical) — callers value reevaluates unchanged, no downstream propagation; ART_CALLERS_REFRESH validity contract re-established by append (STALE → VALID); ART_NO_CALLERS_FACT remains STALE (proposition still false)
      - R1 (unrelated change): zero projection value changes on untouched relations, zero artifact attestation appends — no false semantic invalidation
      - R4/X3: signature/implementation value changes propagate only to their own dependents (ART_VALIDATE_SIG / ART_PROVIDER_SET STALE, all others untouched)
      - X1 (aliased-import caller): semantic evaluation source detects the aliased call site → R2-class STALE; X2 (re-export without call) and X4 (universe growth, no new relationships) produce no artifact validity changes
      - catalog sweep: every artifact_consequences row of R0-R4 and X1-X4 matches the engine's post-transition standing; X5 (coverage degradation → UNKNOWN) documented as M7-gated (coverage certificates do not exist in M6) — deviations are failures, oracle labels never edited
      - explain record: names projection, old value, new value, and affected dependents for every evaluated artifact (§28 item 7)
      - internal EngineState never appears on artifacts or attestations (type-level: attestation carries only Validity/Authority/VerificationLevel); every validity transition is an attestation append, never a mutation
      - oracle labels untouched (fixture files unchanged in git); M0-M5 tests unchanged and green
      - determinism: identical fixture + mutation sequence → identical report content and ordering (no wall-clock in identity)
    evidence_required: run log with test names + fresh review record
  M5_IMPACT_ACCEPTANCE:
    criteria:
      - no false negatives: every observation whose modeled input (file, located symbol, module, eligible universe) changed appears in the candidate set — verified against the M2 mutation catalog cases supported by M3
      - over-approximation is allowed and documented (completeness-sensitive kinds match on any file-level change; unanchored observations match everything)
      - candidate ≠ value-changed ≠ artifact-stale remain distinct concepts in the API (naming + types)
      - deterministic candidate ordering (canonical id sort); duplicate changes deduplicated
      - restart/reload: discovery state persisted (observations + symbol locations); identical results after reopen
      - unsupported semantic knowledge never treated as known: observations of semantic kinds are handled as recorded data, not synthesized
      - M2 oracle labels untouched; used only as independent must-not-miss expectations
      - M0-M4 tests unchanged and green
    evidence_required: run log with test names + fresh review record
  M4_PERSISTENCE_ACCEPTANCE:
    criteria:
      - WAL mode enabled and tested; foreign keys on; multi-row ops transactional
      - CAS put idempotent (same bytes → same id, no duplicate payload), corrupted/missing blobs detected, temp writes never exposed as committed
      - blob-first metadata-second ordering; no committed metadata can reference a non-durable blob
      - domain identity never derived from rowid/insertion order/timestamps/absolute paths; canonical IDs persisted
      - duplicate canonical objects idempotent with identical identity
      - attestations append-only; artifact/attestation mismatch rejected; duplicate attestation identity rejected
      - unsupported schema version explicitly rejected, no silent reinterpretation
      - restart/recovery acceptance: process A persists → process B reopens → domain+identity equality, attestation ordering preserved
      - M0-M3 tests unchanged and green
    evidence_required: run log with test names + fresh review record
  M3_QUERY_ACCEPTANCE:
    criteria:
      - deterministic index/projection results across repeated runs and traversal orders
      - module/class/function/method identity correct on the M2 fixture (never mutating oracle labels)
      - normalized signatures: params incl. pos-only/kw-only/*args/**kwargs, annotations; formatting-insensitive; true signature change alters value
      - imports/aliases represented syntactically
      - malformed Python yields explicit ParseStatus, never silent omission; failed-parse units degrade queries to UNSUPPORTED, never partial Proven results
      - semantic cross-file projections (references/callers/implementations/subclasses) return explicit UNSUPPORTED, never an authoritative empty set
      - changed_symbols maps a reconcile changed-file set to affected symbols; failed-parse units in the set degrade the answer to UNSUPPORTED
      - file-digest projection is content-derived and deterministic
      - no tree-sitter/SCIP types in backend-independent contracts; trellis-core stays std-only
      - source state consumed through M1 abstractions (no second filesystem model)
    evidence_required: run log with test names + fresh review record
  M2_ORACLE_REVIEW:
    criteria:
      - oracle independence verified by a fresh reviewer: no label derived from Trellis machinery or the future engine (BLOCKER if violated)
      - every mutation's expected semantic consequence is unambiguous and machine-readable
      - unchanged-value cases represented, not only invalidation cases (R1, R3, R4-partial, X4)
      - absence/coverage cases explicitly represented (R0, R2, X4, X5)
      - provenance recorded per label (fixture construction, language semantics, independent textual cross-check)
      - catalog schema mechanically enforced by the trellis-oracle test crate
      - fixture baseline test suite passes (unittest run recorded in the node run log)
      - no Trellis-specific annotations or coupling inside fixture source
    evidence_required: run log with unittest output + fresh review record with verdict
  M1_RECONCILE_ACCEPTANCE:
    criteria:
      - reconcile detects add, modify, and delete against a real working tree (tempdir fixture)
      - two manifests built from two identical trees reconcile to an empty changed set
      - manifest digest is stable across independent runs on identical content
      - canonical ID derivation is reproducible (same canonical bytes → same ID); official BLAKE3 test vector passes
      - non-UTF-8 paths and conflicting digests fail loudly (never silently dropped)
      - environment fingerprint: declared-only inputs, deny-by-default, raw values never retained
    evidence_required: passing test names listed in the node run log

# Finding severities. Every review finding is tagged with exactly one.
SEVERITIES:
  BLOCKER:
    description: >
      Correctness, architecture, or oracle-integrity violation; breaks a
      frozen invariant; benchmark-validity violation; broken GLOBAL_GREEN.
    policy: prevents commit; repair loop runs until resolved or escalated
  IMPORTANT:
    description: >
      Real defect or contract gap that does not immediately break
      correctness — e.g. missing edge-case test, contract drift, unclear
      explain trace, acceptance-criterion gap.
    policy: >
      requires correction by default; may be explicitly dispositioned with
      written rationale in the run log. Un-dispositioned IMPORTANT findings
      block commit.
  OPTIONAL:
    description: polish, naming, structure, minor ergonomics.
    policy: >
      goes to BACKLOG. Cannot trigger another repair iteration, cannot
      prevent current milestone completion, and cannot be promoted to
      IMPORTANT merely because an agent finds it interesting.
  OUT_OF_SCOPE:
    description: valid idea, wrong layer or wrong milestone.
    policy: >
      goes to BACKLOG. Cannot trigger another repair iteration and cannot
      block acceptance.

# Commit authorization (spec of the spec: .agent/REVIEWER.md).
COMMIT_AUTHORIZATION:
  rule: >
    A candidate may be committed only if a fresh semantic reviewer has
    issued COMMIT_ALLOWED against the exact candidate state being committed.
  post_repair_closure:
    if_review_produced_BLOCKER_or_IMPORTANT_and_candidate_changed:
      - previous review no longer authorizes commit
      - re-run all required mechanical gates
      - run a fresh reviewer against the FULL candidate diff from the last green commit
      - only the fresh review may authorize the repaired state
  reviewer_unavailable:
    review_state: REVIEW_INCOMPLETE
    on_failed_cancelled_or_incomplete_review:
      - candidate must NOT be committed
      - controller may retry within its bounded retry budget
      - or stop at the previous green checkpoint
  mechanical_vs_semantic: >
    Mechanical verification supplements semantic review; it can never
    replace a required fresh review. Never silently substitute tests for
    the reviewer.

# Review-loop bounds.
REVIEW_LOOP:
  cycle: >
    implement → mechanical gates → fresh review → repair BLOCKER/IMPORTANT
    → mechanical gates → fresh review → commit when COMMIT_ALLOWED
  do_not_pursue_review_perfection: true
  max_materially_similar_failed_repair_cycles: 3
  on_exhaustion:
    - stop repeating the strategy
    - open a fresh diagnosis session
    - split the node or escalate under the existing controller policy
  optional_findings:
    never count as failed repair cycles

# Remote repository mutations require explicit standing human permission.
# Local commits representing coherent verified green checkpoints are
# autonomously permitted. One granted push does not imply standing
# permission. Never force-push autonomously.
REMOTE_POLICY:
  autonomously_permitted:
    - local git commits of coherent verified green checkpoints
  requires_standing_human_permission:
    - git push
    - force-push
    - tag creation
    - release publication
    - pull request creation
    - any other remote repository mutation
  never_autonomous:
    - force-push

# Bounded repair behavior (CONTROLLER.md). Applies to BLOCKER and
# dispositioned IMPORTANT findings.
REPAIR_POLICY:
  max_materially_similar_attempts: 3
  on_exhaustion:
    - stop repeating the same implementation strategy
    - open a fresh diagnosis/research session
    - identify the missing capability or false assumption
    - split the node via a ROADMAP contract amendment (small, evidence-based)
  never:
    - weaken a gate to make it pass
    - edit oracle labels to match implementation
    - disable or skip tests listed in INVARIANT_TESTS

# Escalate to a human ONLY for (CONTROLLER.md §ESCALATION). Routine
# implementation choices are worker judgment and must not escalate.
ESCALATION_TRIGGERS:
  - genuine frozen-architecture contradiction (ARCHITECTURE_CONFLICT)
  - inability to establish benchmark ground truth
  - destructive/external action requiring approval
  - product-level decision not resolved by the frozen spec
  - persistent failure after a strategy change
